<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonhowl</title><style>
:root{--bg:#0d0d0d;--card:#1a1a1a;--text:#e9e7ef;--grey:#aaa7b5;--lav:#c4a7ff;--line:#292832}

main{max-width:720px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:30px;margin:0 0 4px}h2{font-size:18px;margin:32px 0 8px;color:#fff}
.eff{color:var(--lav);letter-spacing:1.5px;font-size:13px;font-weight:600;text-transform:uppercase;margin-bottom:24px}
